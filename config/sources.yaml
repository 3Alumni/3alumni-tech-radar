        url: https://www.sem.admin.ch/dam/de/sd-web/6OFjNdGnYSCt/6-24-best-s-erwerb-2026-10-d.xlsx

  - id: fedlex
    title: Fedlex
    questions: [E]
    type: sparql
    url: https://fedlex.data.admin.ch/sparqlendpoint
    enabled: true
